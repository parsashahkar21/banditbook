[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banditbook"
version = "0.1.0"
description = "Educational implementations from Bandit Algorithms (Lattimore & Szepesvári)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Parsa Shahkar" },
  { name = "Arian Jafari" },
  { name = "Paniz Roozegar" },
]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
]

[project.scripts]
banditbook-experiment = "banditbook.experiments:main"

[project.urls]
Homepage = "https://github.com/parsashahkar21/banditbook"
Documentation = "https://github.com/parsashahkar21/banditbook/tree/main/docs"
Book = "https://tor-lattimore.com/downloads/book/book.pdf"

[tool.setuptools.packages.find]
include = ["banditbook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
