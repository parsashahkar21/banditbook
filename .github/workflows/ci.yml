name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Smoke stochastic experiment
        run: python -m banditbook.experiments --config configs/smoke_stochastic.yaml --out results/ci_stochastic
      - name: Smoke adversarial experiment
        run: python -m banditbook.experiments --config configs/smoke_adversarial.yaml --out results/ci_adversarial
